name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No build step — quibble.js ships as-is. Just verify it parses.
      - name: Syntax check
        run: node --check quibble.js
      - name: Validate sample JSON
        run: node -e "JSON.parse(require('fs').readFileSync('examples/feedback.sample.json','utf8')); console.log('sample JSON ok')"
